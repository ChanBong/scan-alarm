workflows:
  ios-unsigned:
    name: Build unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Generate project
        script: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
      - name: Build (unsigned)
        script: |
          xcodebuild \
            -project ScanAlarm.xcodeproj \
            -scheme ScanAlarm \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        script: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ScanAlarm.app Payload/
          zip -qry ScanAlarm.ipa Payload
    artifacts:
      - ScanAlarm.ipa
